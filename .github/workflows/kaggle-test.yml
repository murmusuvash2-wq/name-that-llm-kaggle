name: Kaggle test and submit

on:
  workflow_dispatch:
    inputs:
      submit:
        description: "Upload the generated prediction to Kaggle"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  kaggle:
    runs-on: ubuntu-latest
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}

    steps:
      - name: Checkout GitHub repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt kaggle

      - name: Check Kaggle authentication
        run: kaggle competitions list --search "Name That LLM"

      - name: Download competition data
        run: |
          mkdir -p data/raw
          kaggle competitions download -c name-that-llm -p data/raw
          find data/raw -maxdepth 1 -type f -name '*.zip' -exec unzip -o {} -d data/raw \;
          ls -lah data/raw

      - name: Train baseline and create submission
        run: |
          python src/baseline.py \
            --data-dir data/raw \
            --output submissions/submission.parquet

      - name: Upload submission artifact
        uses: actions/upload-artifact@v4
        with:
          name: name-that-llm-submission
          path: submissions/submission.parquet
          if-no-files-found: error

      - name: Submit to Kaggle
        if: ${{ inputs.submit == true }}
        run: |
          kaggle competitions submit \
            -c name-that-llm \
            -f submissions/submission.parquet \
            -m "GitHub Actions TF-IDF LinearSVC baseline"

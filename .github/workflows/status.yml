name: Status (six-safe)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  s:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --upgrade pip
          python -m pip install kaggle six python-slugify requests tqdm urllib3 certifi
      - run: |
          echo "===== tpu kernel ====="
          kaggle kernels status janaiworkspace/ntl-tpu-probe 2>&1 | tail -3
          echo "===== submissions ====="
          kaggle competitions submissions -c name-that-llm --csv 2>&1 | head -5
          echo "===== quota ====="
          kaggle quota 2>&1 | tail -6

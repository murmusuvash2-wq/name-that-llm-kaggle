name: Run family-aware TF-IDF diagnostic
on:
  workflow_dispatch:
jobs:
  family-aware:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KAGGLE_USERNAME: janaiworkspace
      KERNEL_REF: janaiworkspace/family-aware-tfidf
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Kaggle CLI
        run: python -m pip install --upgrade pip kaggle
      - name: Prepare notebook
        run: |
          mkdir -p kaggle_family
          cp notebooks/family-aware-tfidf.ipynb kaggle_family/family-aware-tfidf.ipynb
          python - <<'PY'
          import json, os
          meta={"title":"family-aware-tfidf","id":f"{os.environ['KAGGLE_USERNAME']}/family-aware-tfidf","code_file":"family-aware-tfidf.ipynb","language":"python","kernel_type":"notebook","is_private":True,"enable_gpu":False,"enable_internet":False,"dataset_sources":[],"competition_sources":["name-that-llm"],"kernel_sources":[],"model_sources":[]}
          json.dump(meta,open("kaggle_family/kernel-metadata.json","w"),indent=2)
          PY
      - name: Push and run
        run: kaggle kernels push -p kaggle_family
      - name: Wait
        run: |
          mkdir -p family-output
          for i in $(seq 1 180); do
            s="$(kaggle kernels status "$KERNEL_REF" 2>&1 || true)"; echo "Status $i/180: $s"
            if echo "$s" | grep -qi COMPLETE; then exit 0; fi
            if echo "$s" | grep -qiE "ERROR|CANCEL"; then exit 1; fi
            sleep 60
          done
          exit 1
      - name: Download output
        run: kaggle kernels output "$KERNEL_REF" -p family-output
      - uses: actions/upload-artifact@v4
        with:
          name: family-aware-results
          path: family-output/
          if-no-files-found: error

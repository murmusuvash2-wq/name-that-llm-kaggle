name: Read the llama adapter README
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  v:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --upgrade pip
          python -m pip install kaggle six python-slugify requests tqdm urllib3 certifi
      - name: Download the small docs
        shell: bash
        run: |
          mkdir -p d
          kaggle datasets download alexchilton/ntl-ts-llama31-8b -f adapter/README.md -p d --unzip 2>&1 | tail -2
          kaggle datasets download alexchilton/ntl-ts-llama31-8b -f meta.json -p d --unzip 2>&1 | tail -2
          kaggle datasets download alexchilton/ntl-ts-llama31-8b -f adapter/adapter_config.json -p d --unzip 2>&1 | tail -2
          find d -type f | head
          echo "===== README ====="
          cat d/adapter/README.md 2>/dev/null | head -60
          echo "===== meta.json ====="
          cat d/meta.json 2>/dev/null | head -20
          echo "===== adapter_config ====="
          cat d/adapter/adapter_config.json 2>/dev/null | head -20
      - name: Find the llama base ref
        shell: bash
        run: |
          for r in metaresearch/llama-3.1/transformers/8b/1 metaresearch/llama-3.1/transformers/8b-base/1 metaresearch/llama-3.1/pytorch/8b/1; do
            echo "===== $r ====="
            kaggle models instances files "$r" 2>&1 | head -8 || true
          done

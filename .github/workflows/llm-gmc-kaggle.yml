name: Publish and run LLM GMC on Kaggle

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run-llm-gmc:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KAGGLE_USERNAME: janaiworkspace
      KERNEL_REF: janaiworkspace/llm-gmc

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Kaggle CLI
        run: python -m pip install --upgrade pip kaggle

      - name: Check Kaggle credentials
        shell: bash
        run: |
          test -n "$KAGGLE_API_TOKEN" || { echo "Missing repository secret KAGGLE_API_TOKEN"; exit 1; }
          kaggle competitions list --search "Name That LLM"

      - name: Prepare LLM GMC notebook metadata
        shell: bash
        run: |
          mkdir -p kaggle_kernel
          cp notebooks/llm-gmc.ipynb kaggle_kernel/llm-gmc.ipynb
          python - <<'PY'
          import json, os
          metadata = {
              "title": "LLM GMC",
              "id": f"{os.environ['KAGGLE_USERNAME']}/llm-gmc",
              "code_file": "llm-gmc.ipynb",
              "language": "python",
              "kernel_type": "notebook",
              "is_private": True,
              "enable_gpu": False,
              "enable_internet": False,
              "dataset_sources": [],
              "competition_sources": ["name-that-llm"],
              "kernel_sources": [],
              "model_sources": []
          }
          with open("kaggle_kernel/kernel-metadata.json", "w") as f:
              json.dump(metadata, f, indent=2)
          PY

      - name: Push LLM GMC notebook to Kaggle
        run: kaggle kernels push -p kaggle_kernel

      - name: Wait for Kaggle notebook run
        shell: bash
        run: |
          set -o pipefail
          mkdir -p kaggle-output
          completed=false
          for attempt in $(seq 1 90); do
            status="$(kaggle kernels status "$KERNEL_REF" 2>&1 || true)"
            echo "Status check $attempt/90: $status"
            if echo "$status" | grep -qi "COMPLETE"; then
              completed=true
              break
            fi
            if echo "$status" | grep -qiE "ERROR|CANCEL"; then
              echo "Kaggle notebook reported a failure."
              exit 1
            fi
            sleep 60
          done
          if [ "$completed" != true ]; then
            echo "Timed out waiting for Kaggle notebook. Check the notebook page for final status."
            exit 1
          fi

      - name: Download Kaggle notebook outputs
        run: kaggle kernels output "$KERNEL_REF" -p kaggle-output

      - name: Upload validation results and Kaggle outputs
        uses: actions/upload-artifact@v4
        with:
          name: llm-gmc-validation-results
          path: kaggle-output/
          if-no-files-found: warn

name: Run and submit v2 (guarded)
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/run-and-submit2.yml"
      - "notebooks/llm-gmc.ipynb"
  workflow_dispatch:
    inputs:
      submit:
        description: "Submit this completed Kaggle kernel version for scoring (uses a submission)"
        required: true
        default: false
        type: boolean
      msg:
        required: false
        default: "guarded run: verified kernel completion and output"
permissions:
  contents: read
jobs:
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KAGGLE_USERNAME: janaiworkspace
      KERNEL_REF: janaiworkspace/llm-gmc
      MSG: ${{ inputs.msg }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Kaggle CLI
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install kaggle six python-slugify requests tqdm urllib3 certifi
          python -c "import six, kaggle; print('Kaggle CLI ready')"
          test -n "$KAGGLE_API_TOKEN" || { echo "::error::Missing KAGGLE_API_TOKEN"; exit 1; }
      - name: Push notebook and capture version
        id: push
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p kk
          cp notebooks/llm-gmc.ipynb kk/llm-gmc.ipynb
          python - <<'PY'
          import json, os
          m = {"title": "LLM GMC", "id": f"{os.environ['KAGGLE_USERNAME']}/llm-gmc",
               "code_file": "llm-gmc.ipynb", "language": "python", "kernel_type": "notebook",
               "is_private": True, "enable_gpu": True, "enable_internet": False,
               "dataset_sources": ["nishantdahal/ntl-handwriting-blend",
                                   "lightningv08/ntl-olmo2-native24-final-inference-assets",
                                   "pjmathematician/ultrabert-380m-ntl",
                                   "illiadolenko/ntl-merged-corpus-v2",
                                   "trnhip/ntl-api-gen",
                                   "harshitkmr/ntl-google-gen-v1",
                                   "dhruvtibarewal/nlm-l24-adapters-v5",
                                   "dhruvtibarewal/nlm-matched-clean",
                                   "alexchilton/ntl-ts-q3-8b",
                                   "janaiworkspace/ntl-deb-ours"],
               "competition_sources": ["name-that-llm"], "kernel_sources": [],
               "model_sources": ["qwen-lm/qwen-3/transformers/14b-base/1",
                                 "qwen-lm/qwen2.5/transformers/14b/1",
                                 "alexchilton/llama-3-1-8b-base/transformers/default/1",
                                 "qwen-lm/qwen-3/transformers/8b-base/1"]}
          with open("kk/kernel-metadata.json", "w") as f:
              json.dump(m, f, indent=2)
          PY
          kaggle kernels push -p kk 2>&1 | tee push.log
          KV="$(grep -oE 'version [0-9]+' push.log | grep -oE '[0-9]+' | tail -1)"
          test -n "$KV" || { echo "::error::Could not determine pushed kernel version"; exit 1; }
          echo "version=$KV" >> "$GITHUB_OUTPUT"
          echo "Pushed kernel version: $KV"
      - name: Wait for terminal Kaggle kernel status
        id: status
        shell: bash
        run: |
          set -euo pipefail
          final=""
          for i in $(seq 1 90); do
            out="$(kaggle kernels status "$KERNEL_REF" 2>&1)" || { echo "$out"; exit 1; }
            echo "poll $i: $out"
            if echo "$out" | grep -q "KernelWorkerStatus.COMPLETE"; then final="COMPLETE"; break; fi
            if echo "$out" | grep -Eq "KernelWorkerStatus.(ERROR|CANCEL)"; then final="FAILED"; break; fi
            sleep 45
          done
          if [ "$final" != "COMPLETE" ]; then
            echo "::error::Kaggle kernel did not complete successfully (terminal=$final)"
            kaggle kernels logs "$KERNEL_REF" || true
            exit 1
          fi
          echo "final=COMPLETE" >> "$GITHUB_OUTPUT"
      - name: Download and validate notebook outputs
        shell: bash
        run: |
          set -euo pipefail
          rm -rf out && mkdir -p out
          kaggle kernels output "$KERNEL_REF" -p out
          test -f out/submission.parquet || { echo "::error::submission.parquet missing from Kaggle kernel output"; ls -la out; exit 1; }
          python - <<'PY'
          import pandas as pd
          p = "out/submission.parquet"
          d = pd.read_parquet(p)
          labels = {"gpt-5.5","gpt-5.6-luna","gpt-5.6-sol","gpt-5.6-terra","gpt-6-astra",
                    "gemini-3.1-pro-preview","gemini-3.6-flash","gemini-3.7-flash","gemini-3.8-flash",
                    "claude-fable-5","claude-opus-4-6","claude-opus-4-8","claude-opus-5","claude-sonnet-5",
                    "qwen3.8-max","glm-5.3","glm-5.3-flash","kimi-k3"}
          assert list(d.columns) == ["id", "model"], f"unexpected columns: {list(d.columns)}"
          assert len(d) > 0, "empty submission"
          assert d["id"].notna().all() and d["model"].notna().all(), "null id/model"
          assert d["id"].is_unique, "duplicate ids"
          bad = sorted(set(d["model"]) - labels)
          assert not bad, f"invalid labels: {bad}"
          print(f"Validated preview output: {len(d)} rows; {d['model'].nunique()} distinct labels")
          PY
      - name: Submit completed kernel version
        if: ${{ inputs.submit }}
        shell: bash
        run: |
          set -euo pipefail
          kaggle competitions submit name-that-llm -k "$KERNEL_REF" -v "${{ steps.push.outputs.version }}" -f submission.parquet -m "$MSG" --wait 0
      - name: Report submission mode
        if: ${{ !inputs.submit }}
        run: echo "Kernel run and output validation succeeded. Leaderboard submission was intentionally disabled.";

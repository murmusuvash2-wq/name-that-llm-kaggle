name: Does our checkpoint dataset exist
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  s:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --upgrade pip
          python -m pip install kaggle six python-slugify requests tqdm urllib3 certifi
      - name: Check and publish if missing
        shell: bash
        run: |
          mkdir -p reports out
          {
            echo "===== does janaiworkspace/ntl-deb-ours exist? ====="
            kaggle datasets files janaiworkspace/ntl-deb-ours --csv 2>&1 | head -10 || echo "NOT FOUND"
            echo
            echo "===== what the probe kernel actually produced ====="
            rm -rf out && mkdir -p out
            kaggle kernels output janaiworkspace/ntl-probe-deb-ours -p out 2>&1 | tail -3 || true
            find out -maxdepth 3 -type d | head -10
            find out -maxdepth 3 -type f -name "meta.json" | head -5
          } > reports/dscheck.txt
          cat reports/dscheck.txt
      - name: Publish if it is missing
        shell: bash
        run: |
          if ! kaggle datasets files janaiworkspace/ntl-deb-ours --csv >/dev/null 2>&1; then
            echo "dataset missing — publishing from the kernel output"
            SRC="$(find out -maxdepth 2 -type d -name 'deberta_ours' | head -1)"
            echo "source: $SRC"
            if [ -n "$SRC" ]; then
              python3 - "$SRC" <<'PY'
          import json, os, sys
          d = sys.argv[1]
          json.dump({"title": "NTL deb ours", "id": "janaiworkspace/ntl-deb-ours"},
                    open(os.path.join(d, "dataset-metadata.json"), "w"), indent=2)
          PY
              kaggle datasets create -p "$SRC" 2>&1 | tail -4
            else
              echo "no deberta_ours directory in the output"
            fi
          else
            echo "dataset already exists"
          fi
      - name: Commit
        shell: bash
        run: |
          git config user.name "report-bot"
          git config user.email "report-bot@users.noreply.github.com"
          git add reports/dscheck.txt
          git commit -m "report: dataset check" || echo nothing
          git push

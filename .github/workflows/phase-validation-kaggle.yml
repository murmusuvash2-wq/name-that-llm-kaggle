name: Run permanent phase validation notebook
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KAGGLE_USERNAME: janaiworkspace
      KERNEL_REF: janaiworkspace/phase1-validation
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Kaggle CLI
        run: python -m pip install --upgrade pip kaggle
      - name: Prepare validation notebook metadata
        shell: bash
        run: |
          test -n "$KAGGLE_API_TOKEN" || { echo "Missing KAGGLE_API_TOKEN"; exit 1; }
          mkdir -p kaggle_phase_validation
          cp notebooks/phase1-validation.ipynb kaggle_phase_validation/phase1-validation.ipynb
          python - <<'PY'
          import json, os
          metadata = {
              "title": "phase1-validation",
              "id": f"{os.environ['KAGGLE_USERNAME']}/phase1-validation",
              "code_file": "phase1-validation.ipynb",
              "language": "python",
              "kernel_type": "notebook",
              "is_private": True,
              "enable_gpu": False,
              "enable_internet": False,
              "competition_sources": ["name-that-llm"],
              "dataset_sources": ["nishantdahal/ntl-two-stage-lora"],
              "kernel_sources": [],
              "model_sources": []
          }
          with open("kaggle_phase_validation/kernel-metadata.json", "w") as f:
              json.dump(metadata, f, indent=2)
          PY
      - name: Push validation notebook to Kaggle
        run: kaggle kernels push -p kaggle_phase_validation
      - name: Wait for Kaggle validation run
        shell: bash
        run: |
          set -o pipefail
          mkdir -p kaggle-validation-output
          for attempt in $(seq 1 210); do
            status="$(kaggle kernels status "$KERNEL_REF" 2>&1 || true)"
            echo "Status check $attempt/210: $status"
            if echo "$status" | grep -qi "COMPLETE"; then break; fi
            if echo "$status" | grep -qiE "ERROR|CANCEL"; then exit 1; fi
            sleep 60
          done
      - name: Download validation output
        run: kaggle kernels output "$KERNEL_REF" -p kaggle-validation-output
      - name: Upload validation artifact
        uses: actions/upload-artifact@v4
        with:
          name: permanent-phase-validation
          path: kaggle-validation-output/
          if-no-files-found: warn

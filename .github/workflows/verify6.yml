name: Final verify llama ref and meta
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  v:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --upgrade pip
          python -m pip install kaggle six python-slugify requests tqdm urllib3 certifi
      - name: meta.json of the llama adapter
        shell: bash
        run: |
          mkdir -p d
          kaggle datasets download alexchilton/ntl-ts-llama31-8b -f meta.json -p d --unzip >/dev/null 2>&1
          echo "===== meta.json ====="
          cat d/meta.json
      - name: Kaggle model instance refs (4 parts)
        shell: bash
        run: |
          for r in metaresearch/llama-3.1/transformers/8b metaresearch/llama-3.1/transformers/8b-instruct metaresearch/llama-3.1/transformers/8b-base; do
            echo "===== $r ====="
            kaggle models instances files "$r" 2>&1 | head -6 || true
          done

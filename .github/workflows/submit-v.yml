name: Submit a kernel version (six-safe)
on:
  workflow_dispatch:
    inputs:
      kernel_version:
        required: true
        default: "87"
      message:
        required: true
        default: "v66: 0.639 weights + Bayesian typography"
permissions:
  contents: read
jobs:
  s:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KERNEL_REF: janaiworkspace/llm-gmc
      KV: ${{ inputs.kernel_version }}
      MSG: ${{ inputs.message }}
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install CLI (six is imported but undeclared)
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install kaggle six python-slugify requests tqdm urllib3 certifi
      - name: Wait until the kernel is really finished
        shell: bash
        run: |
          for i in $(seq 1 200); do
            out="$(kaggle kernels status "$KERNEL_REF" 2>&1 || true)"
            st="$(echo "$out" | grep -oE 'KernelWorkerStatus\.[A-Z]+' | head -1)"
            echo "check $i: $st"
            case "$st" in
              *COMPLETE*) echo "READY=yes" >> "$GITHUB_ENV"; break ;;
              *ERROR*|*CANCEL*) echo "READY=no" >> "$GITHUB_ENV"; break ;;
            esac
            sleep 45
          done
          echo "final: ${st:-unknown}"
      - name: Submit only if it completed
        if: env.READY == 'yes'
        shell: bash
        run: |
          rm -rf out && mkdir -p out
          kaggle kernels output "$KERNEL_REF" -p out 2>&1 | tail -2 || true
          cat out/validation_results.json 2>/dev/null | head -20 || true
          if [ -f out/submission.parquet ]; then cp out/submission.parquet submission.parquet; fi
          ls -la submission.parquet 2>/dev/null || echo "no submission.parquet"
          echo "submitting version $KV"
          kaggle competitions submit -c name-that-llm -k "$KERNEL_REF" -v "$KV" -f submission.parquet -m "$MSG" 2>&1 | tail -6 || true
          for i in $(seq 1 40); do
            kaggle competitions submissions -c name-that-llm --csv 2>&1 | head -3
            kaggle competitions submissions -c name-that-llm --csv 2>&1 | head -2 | grep -qE "COMPLETE,[0-9]" && break
            sleep 30
          done
      - name: Report if it could not be submitted
        if: env.READY != 'yes'
        shell: bash
        run: echo "kernel never reached COMPLETE — nothing was submitted"

name: Generate from the real prompt bank
on:
  workflow_dispatch:
    inputs:
      models:
        required: true
        default: "gpt-5.6-sol,gpt-5.6-luna,gpt-5.6-terra,gemini-3.8-flash"
      do_push:
        required: true
        default: true
        type: boolean
      n_prompts:
        required: true
        default: "250"
permissions:
  contents: read
jobs:
  gen:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      TASK: ntl-real-prompts
      MODELS: ${{ inputs.models }}
      N_PROMPTS: ${{ inputs.n_prompts }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip kaggle pandas
      - name: Quota before
        shell: bash
        run: kaggle benchmarks quota || true
      - name: Fetch the real prompt bank
        shell: bash
        run: |
          mkdir -p ref
          kaggle datasets download seyitkaangunes/ntl-extra-api-passages -f prompts.csv -p ref --unzip 2>&1 | tail -3 || true
          kaggle datasets download seyitkaangunes/ntl-extra-api-passages -p ref --unzip 2>&1 | tail -3 || true
          find ref -name "*.csv" | head -10
      - name: Build the task
        shell: bash
        run: |
          CSV="$(find ref -name "prompts.csv" | head -1)"
          [ -z "$CSV" ] && CSV="$(find ref -name "*.csv" | head -1)"
          echo "using $CSV"
          python benchmarks/build_task.py "$CSV" task.py "$N_PROMPTS"
      - name: Push
        if: ${{ inputs.do_push }}
        shell: bash
        run: kaggle benchmarks tasks push "$TASK" -f task.py --wait 1200 --poll-interval 30 2>&1 | tail -20 || true
      - name: Run each model separately
        shell: bash
        run: |
          for m in $(echo "$MODELS" | tr ',' ' '); do
            echo "########## $m"
            kaggle benchmarks tasks run "$TASK" -m "$m" --wait 2400 --poll-interval 45 2>&1 | tail -10 || true
          done
      - name: Download and count
        if: always()
        shell: bash
        run: |
          mkdir -p out
          kaggle benchmarks tasks download "$TASK" -o out -f 2>&1 | tail -12 || true
          python benchmarks/count_passages.py out
      - name: Quota after
        if: always()
        shell: bash
        run: kaggle benchmarks quota || true

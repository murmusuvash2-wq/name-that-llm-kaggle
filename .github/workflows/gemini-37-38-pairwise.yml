name: Gemini 3.7 vs 3.8 pairwise OOF diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KAGGLE_USERNAME: janaiworkspace
      KERNEL_REF: janaiworkspace/gemini-37-38-pairwise-diagnostic
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip kaggle six
      - name: Prepare notebook
        run: |
          mkdir -p kaggle_pairwise
          cp notebooks/gemini-37-38-pairwise-diagnostic.ipynb kaggle_pairwise/
          python - <<'PY'
          import json, os
          m={"title":"Gemini 37 38 Pairwise Diagnostic","id":f"{os.environ['KAGGLE_USERNAME']}/gemini-37-38-pairwise-diagnostic","code_file":"gemini-37-38-pairwise-diagnostic.ipynb","language":"python","kernel_type":"notebook","is_private":True,"enable_gpu":False,"enable_internet":False,"dataset_sources":[],"competition_sources":["name-that-llm"],"kernel_sources":[],"model_sources":[]}
          json.dump(m,open('kaggle_pairwise/kernel-metadata.json','w'),indent=2)
          PY
      - name: Push notebook
        run: kaggle kernels push -p kaggle_pairwise
      - name: Wait and collect
        run: |
          set -o pipefail
          mkdir -p pairwise-output
          done_flag=false
          for i in $(seq 1 300); do
            s="$(timeout 90s kaggle kernels status "$KERNEL_REF" 2>&1 || true)"; echo "Status $i/300: $s"
            if echo "$s" | grep -qiE 'COMPLETE|SUCCESS'; then done_flag=true; break; fi
            if echo "$s" | grep -qiE 'ERROR|CANCEL|FAILED'; then exit 1; fi
            sleep 60
          done
          [ "$done_flag" = true ]
          kaggle kernels output "$KERNEL_REF" -p pairwise-output
          test -f pairwise-output/gemini_pairwise_results.json
      - name: Validate result contract
        run: |
          python - <<'PY'
          import json
          d=json.load(open('pairwise-output/gemini_pairwise_results.json'))
          assert d['pair']==['gemini-3.7-flash','gemini-3.8-flash']
          assert d['protocol'].startswith('5-fold GroupKFold')
          assert d['predeclared_promotion_margin']==0.010
          assert len(d['thresholds'])==6
          print(json.dumps({k:d[k] for k in ['experiment','base_balanced_accuracy','selected','elapsed_seconds']}, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gemini-37-38-pairwise-results
          path: pairwise-output/
          if-no-files-found: warn

name: Diag2 (long kernel log)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  d:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --upgrade pip
          python -m pip install kaggle six python-slugify requests tqdm urllib3 certifi
      - name: Full validation results
        shell: bash
        run: |
          mkdir -p out
          kaggle kernels output janaiworkspace/llm-gmc -p out 2>&1 | tail -2 || true
          echo "===== FULL validation_results.json ====="
          cat out/validation_results.json
      - name: The audit lines from the kernel log
        shell: bash
        run: |
          echo "===== every lora / audit line ====="
          grep -iE "lora_qwen|audit|in-sample|pool .* rows|not admitted|deberta" out/llm-gmc.log | head -30

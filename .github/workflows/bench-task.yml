name: Run the NTL generation task on Benchmarks

on:
  workflow_dispatch:
    inputs:
      models:
        description: "Model slugs, comma separated"
        required: true
        default: "gpt-5.6-luna,gpt-5.6-sol,gpt-5.6-terra"

permissions:
  contents: read

jobs:
  task:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      TASK: ntl-passage-generation
      MODELS: ${{ inputs.models }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip kaggle

      - name: Quota before
        shell: bash
        run: kaggle benchmarks quota || true

      - name: Push the task
        shell: bash
        run: |
          kaggle benchmarks tasks push "$TASK" -f benchmarks/ntl_passage_generation.py --wait 900 --poll-interval 30 -v 2>&1 | tail -40 || true

      - name: Run against the models
        shell: bash
        run: |
          ARGS=""
          for m in $(echo "$MODELS" | tr ',' ' '); do ARGS="$ARGS -m $m"; done
          echo "running:$ARGS"
          kaggle benchmarks tasks run "$TASK" $ARGS --wait 2400 --poll-interval 45 -v 2>&1 | tail -60 || true

      - name: Status
        shell: bash
        run: kaggle benchmarks tasks status "$TASK" 2>&1 | head -40 || true

      - name: Download the outputs
        if: always()
        shell: bash
        run: |
          mkdir -p out
          kaggle benchmarks tasks download "$TASK" -o out -f 2>&1 | tail -20 || true
          find out -maxdepth 3 -type f | head -30
          du -sh out 2>/dev/null || true

      - name: Logs
        if: always()
        shell: bash
        run: |
          for m in $(echo "$MODELS" | tr ',' ' '); do
            echo "########## $m"
            kaggle benchmarks tasks log "$TASK" -m "$m" 2>&1 | tail -25 || true
          done

      - name: Quota after
        if: always()
        shell: bash
        run: kaggle benchmarks quota || true

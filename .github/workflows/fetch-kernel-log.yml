name: Fetch a Kaggle kernel log

on:
  workflow_dispatch:
    inputs:
      kernel:
        description: "One kernel ref, or several separated by commas"
        required: true
        default: "janaiworkspace/ntl-train-lora24"
      lines:
        description: "How many log lines to print"
        required: true
        default: "200"

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KERNEL_REF: ${{ inputs.kernel }}

    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Kaggle CLI
        run: python -m pip install --upgrade pip kaggle

      - name: Download every kernel log
        shell: bash
        run: |
          mkdir -p out
          for ref in $(echo "$KERNEL_REF" | tr ',' ' '); do
            echo "############################################################"
            echo "### $ref"
            echo "############################################################"
            kaggle kernels status "$ref" || true
            kaggle kernels output "$ref" -p "out/$(echo "$ref" | tr '/' '_')" || true
            find "out/$(echo "$ref" | tr '/' '_')" -maxdepth 3 -type f 2>/dev/null | head -20
            for f in "out/$(echo "$ref" | tr '/' '_')"/*.log; do
              [ -e "$f" ] || continue
              echo "===== $f (tail ${{ inputs.lines }}) ====="
              tail -n "${{ inputs.lines }}" "$f"
            done
          done

name: Publish our deberta checkpoint
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  s:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --upgrade pip
          python -m pip install kaggle six python-slugify requests tqdm urllib3 certifi
      - name: Pull the probe output and publish it
        shell: bash
        run: |
          rm -rf out && mkdir -p out
          kaggle kernels output janaiworkspace/ntl-probe-deb-ours -p out 2>&1 | tail -2
          ls -la out | head
          python3 benchmarks/publish_dataset.py out/deberta_ours janaiworkspace/ntl-deb-ours "NTL deb ours"

name: Publish our deberta checkpoint
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  s:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --upgrade pip
          python -m pip install kaggle six python-slugify requests tqdm urllib3 certifi
      - name: Pull, version, verify the encoder is there
        shell: bash
        run: |
          mkdir -p reports
          exec > >(tee reports/publish_deb.txt) 2>&1
          rm -rf out && mkdir -p out
          kaggle kernels output janaiworkspace/ntl-probe-deb-ours -p out >/dev/null 2>&1 || true
          ls -la out/deberta_ours
          du -sh out/deberta_ours/encoder
          python3 - <<'PY'
          import json, os
          d = "out/deberta_ours"
          json.dump({"title": "NTL deb ours", "id": "janaiworkspace/ntl-deb-ours",
                     "licenses": [{"name": "other"}]},
                    open(os.path.join(d, "dataset-metadata.json"), "w"), indent=2)
          print("wrote dataset-metadata.json")
          PY
          echo "--- version (create already exists) ---"
          kaggle datasets version -p out/deberta_ours -m "full checkpoint with encoder" || echo "VERSION EXIT $?"
          echo "--- verify ---"
          kaggle datasets files janaiworkspace/ntl-deb-ours --csv | head -12
      - name: Commit
        if: always()
        shell: bash
        run: |
          git config user.name "report-bot"
          git config user.email "report-bot@users.noreply.github.com"
          git add reports/publish_deb.txt || true
          git commit -m "report: publish deberta version" || echo nothing
          git push || echo "push failed"

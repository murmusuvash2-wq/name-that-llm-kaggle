name: Publish our deberta checkpoint
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  s:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --upgrade pip
          python -m pip install kaggle six python-slugify requests tqdm urllib3 certifi
      - name: Pull and publish, capturing everything
        shell: bash
        run: |
          mkdir -p reports
          exec > >(tee reports/publish_deb.txt) 2>&1
          rm -rf out && mkdir -p out
          echo "--- pulling kernel output ---"
          kaggle kernels output janaiworkspace/ntl-probe-deb-ours -p out || echo "pull exit $?"
          echo "--- out tree ---"
          find out -maxdepth 3 | head -25
          echo "--- publishing ---"
          python3 benchmarks/publish_dataset.py out/deberta_ours janaiworkspace/ntl-deb-ours "NTL deb ours" || echo "PUBLISH EXIT $?"
      - name: Commit the report whatever happened
        if: always()
        shell: bash
        run: |
          git config user.name "report-bot"
          git config user.email "report-bot@users.noreply.github.com"
          git add reports/publish_deb.txt || true
          git commit -m "report: publish deberta" || echo nothing
          git push || echo "push failed"

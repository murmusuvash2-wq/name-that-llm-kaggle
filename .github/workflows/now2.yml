name: Now2 (six-safe)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  s:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --upgrade pip
          python -m pip install kaggle six python-slugify requests tqdm urllib3 certifi
      - run: |
          echo "===== submissions ====="
          kaggle competitions submissions -c name-that-llm --csv 2>&1 | head -8
          echo "===== leaderboard top ====="
          kaggle competitions leaderboard -c name-that-llm --csv 2>&1 | head -8 || true
          echo "===== tpu ====="
          kaggle kernels status janaiworkspace/ntl-tpu-probe 2>&1 | tail -1
          echo "===== llama fetch ====="
          kaggle kernels status janaiworkspace/ntl-llama-fetch 2>&1 | tail -1

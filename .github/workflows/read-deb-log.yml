name: Read training log body
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  s:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --upgrade pip
          python -m pip install kaggle six python-slugify requests tqdm urllib3 certifi
      - name: Pull and dump
        shell: bash
        run: |
          mkdir -p out reports
          kaggle kernels output janaiworkspace/ntl-train-deb-ours -p out 2>&1 | tail -2 || true
          python3 benchmarks/dump_kernel_log.py "out/*.log" > reports/deb_log_body.txt
          wc -l reports/deb_log_body.txt
          tail -40 reports/deb_log_body.txt
      - name: Commit
        shell: bash
        run: |
          git config user.name "report-bot"
          git config user.email "report-bot@users.noreply.github.com"
          git add reports/deb_log_body.txt
          git commit -m "report: deb training log body" || echo "nothing"
          git push

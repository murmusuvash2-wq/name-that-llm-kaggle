name: Hard-pair specialist diagnostic
on:
  workflow_dispatch:
jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KAGGLE_USERNAME: janaiworkspace
      KERNEL_REF: janaiworkspace/hard-pair-specialist-diagnostic
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip kaggle
      - name: Prepare diagnostic notebook
        run: |
          mkdir -p kaggle_pair
          cp notebooks/hard-pair-specialist-diagnostic.ipynb kaggle_pair/
          python - <<'PY'
          import json, os
          m={"title":"Hard-pair specialist diagnostic","id":f"{os.environ['KAGGLE_USERNAME']}/hard-pair-specialist-diagnostic","code_file":"hard-pair-specialist-diagnostic.ipynb","language":"python","kernel_type":"notebook","is_private":True,"enable_gpu":False,"enable_internet":False,"dataset_sources":[],"competition_sources":["name-that-llm"],"kernel_sources":[],"model_sources":[]}
          json.dump(m,open('kaggle_pair/kernel-metadata.json','w'),indent=2)
          PY
      - run: kaggle kernels push -p kaggle_pair
      - name: Wait and collect
        run: |
          mkdir -p pair-output
          done_flag=false
          for i in $(seq 1 210); do
            s="$(kaggle kernels status "$KERNEL_REF" 2>&1 || true)"; echo "Status $i/210: $s"
            if echo "$s" | grep -qi COMPLETE; then done_flag=true; break; fi
            if echo "$s" | grep -qiE "ERROR|CANCEL"; then exit 1; fi
            sleep 60
          done
          [ "$done_flag" = true ]
          kaggle kernels output "$KERNEL_REF" -p pair-output
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hard-pair-results
          path: pair-output/
          if-no-files-found: warn

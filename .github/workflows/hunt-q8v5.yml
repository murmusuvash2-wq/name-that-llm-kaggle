name: Hunt the q8v5 adapter
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  h:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip kaggle
      - name: Folders in the v5 adapters
        shell: bash
        run: |
          echo "########## all folders in nlm-l24-adapters-v5"
          kaggle datasets files dhruvtibarewal/nlm-l24-adapters-v5 --csv 2>&1 | cut -d, -f1 | grep "/" | sed 's#/[^/]*$##' | sort -u
      - name: The older adapter dataset
        shell: bash
        run: |
          echo "########## folders in nlm-l24-adapters"
          kaggle datasets files dhruvtibarewal/nlm-l24-adapters --csv 2>&1 | cut -d, -f1 | grep "/" | sed 's#/[^/]*$##' | sort -u | head -30
      - name: The lightningv08 hub
        shell: bash
        run: |
          echo "########## hub folders (one level)"
          kaggle datasets files lightningv08/ntl-olmo2-native24-final-inference-assets --csv 2>&1 | cut -d, -f1 | grep "/" | sed 's#/[^/]*$##' | sort -u | head -40
      - name: Search datasets for 8b adapters
        shell: bash
        run: |
          for q in "q8v5" "lora24 8b" "ntl adapters 8b"; do
            echo "########## $q"
            kaggle datasets list -s "$q" --csv 2>&1 | head -6 || true
          done

name: Data research
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  s:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --upgrade pip
          python -m pip install kaggle six python-slugify requests tqdm urllib3 certifi
      - name: Every NTL dataset, sorted by recency
        shell: bash
        run: |
          mkdir -p reports
          {
            for q in "name-that-llm" "ntl pool" "ntl generations" "ntl proxy" "ntl adapters" "ntl lora"; do
              echo "########## search: $q"
              kaggle datasets list -s "$q" --sort-by updated --csv 2>&1 | head -14
              echo
            done
          } > reports/data_research.txt
          wc -l reports/data_research.txt
          head -60 reports/data_research.txt
      - name: Commit
        shell: bash
        run: |
          git config user.name "report-bot"
          git config user.email "report-bot@users.noreply.github.com"
          git add reports/data_research.txt
          git commit -m "report: data research" || echo nothing
          git push

name: Diag (six-safe)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  d:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install CLI (six is imported but undeclared)
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install kaggle six python-slugify requests tqdm urllib3 certifi
          python -c "import six; print('six ok')"
      - name: Kernel log
        shell: bash
        run: |
          mkdir -p out
          kaggle kernels output janaiworkspace/llm-gmc -p out 2>&1 | tail -2 || true
          ls -la out | head
          echo "===== validation_results.json ====="
          cat out/validation_results.json 2>/dev/null | head -60 || echo "(not present)"
      - name: Kernel log text
        shell: bash
        run: |
          kaggle kernels output janaiworkspace/llm-gmc -p out --file-pattern ".*\.log" 2>&1 | tail -2 || true
          for f in out/*.log; do
            [ -f "$f" ] || continue
            echo "##### $f"
            grep -iE "in-sample|LOADER SUSPECT|pool .* rows|weight|admitted|Q14V5|out-of-fold|offsets|done in" "$f" | tail -20
          done
      - name: Adapter folders everywhere
        shell: bash
        run: |
          for d in dhruvtibarewal/nlm-l24-adapters-v5 dhruvtibarewal/nlm-l24-adapters; do
            echo "########## $d"
            kaggle datasets files "$d" --csv 2>&1 | cut -d, -f1 | grep "/" | sed 's#/[^/]*$##' | sort -u | head -20
          done
          echo "########## search for q8v5"
          kaggle datasets list -s "q8v5" --csv 2>&1 | head -5 || true
          kaggle datasets list -s "lora24" --csv 2>&1 | head -8 || true
      - name: Submissions
        shell: bash
        run: kaggle competitions submissions -c name-that-llm --csv 2>&1 | head -6

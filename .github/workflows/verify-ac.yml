name: Verify atlas and comp
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  s:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --upgrade pip
          python -m pip install kaggle six python-slugify requests tqdm urllib3 certifi
      - name: Look for the artifacts
        shell: bash
        run: |
          mkdir -p reports
          {
            for d in josephadamski91/ntl-atlas-qwen3-8b-v1; do
              echo "===== $d ====="
              kaggle datasets files "$d" --csv 2>&1 | head -12
              echo
            done
            for q in "ntl comp stack" "ntl atlas" "ntl comp logit"; do
              echo "########## search: $q"
              kaggle datasets list -s "$q" --sort-by updated --csv 2>&1 | head -8
              echo
            done
          } > reports/atlas_comp.txt
          cat reports/atlas_comp.txt
      - name: Commit
        if: always()
        shell: bash
        run: |
          git config user.name "report-bot"
          git config user.email "report-bot@users.noreply.github.com"
          git add reports/ || true
          git commit -m "report: atlas and comp artifacts" || echo nothing
          git push || echo "push failed"

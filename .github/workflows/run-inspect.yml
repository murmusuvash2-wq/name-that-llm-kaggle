name: Inspect the two-stage members
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  s:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KAGGLE_USERNAME: janaiworkspace
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --upgrade pip
          python -m pip install kaggle six python-slugify requests tqdm urllib3 certifi
      - name: Push an inspect kernel
        shell: bash
        run: |
          mkdir -p kk && cp notebooks/inspect-ts.ipynb kk/inspect-ts.ipynb
          python - <<'PY'
          import json, os
          m = {"title": "NTL inspect ts", "id": f"{os.environ['KAGGLE_USERNAME']}/ntl-inspect-ts",
               "code_file": "inspect-ts.ipynb", "language": "python", "kernel_type": "notebook",
               "is_private": True, "enable_gpu": False, "enable_internet": False,
               "dataset_sources": ["alexchilton/ntl-ts-q3-8b", "alexchilton/ntl-ts-gemma2-9b"],
               "competition_sources": [], "kernel_sources": [], "model_sources": []}
          json.dump(m, open("kk/kernel-metadata.json", "w"), indent=2)
          PY
          kaggle kernels push -p kk 2>&1 | tail -2
          for i in $(seq 1 40); do
            st="$(kaggle kernels status janaiworkspace/ntl-inspect-ts 2>&1 | grep -oE 'KernelWorkerStatus\.[A-Z]+' | head -1)"
            echo "check $i: $st"
            case "$st" in *COMPLETE*|*ERROR*|*CANCEL*) break ;; esac
            sleep 30
          done
      - name: Dump the layout into the repo
        shell: bash
        run: |
          mkdir -p out reports
          kaggle kernels output janaiworkspace/ntl-inspect-ts -p out 2>&1 | tail -2 || true
          python3 benchmarks/dump_kernel_log.py "out/*.log" > reports/ts_layout.txt 2>&1 || true
          head -80 reports/ts_layout.txt
      - name: Commit
        shell: bash
        run: |
          git config user.name "report-bot"
          git config user.email "report-bot@users.noreply.github.com"
          git add reports/ts_layout.txt
          git commit -m "report: two-stage member layout" || echo nothing
          git push

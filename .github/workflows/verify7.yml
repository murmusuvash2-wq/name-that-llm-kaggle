name: Find the llama instance slug
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  v:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --upgrade pip
          python -m pip install kaggle six python-slugify requests tqdm urllib3 certifi
      - name: Instance list
        shell: bash
        run: |
          echo "===== instances list ====="
          kaggle models instances list metaresearch/llama-3.1 2>&1 | head -20 || true
      - name: Try likely 4-part refs
        shell: bash
        run: |
          for r in metaresearch/llama-3.1/transformers/llama-3.1-8b metaresearch/llama-3.1/transformers/8b-instruct-hf metaresearch/llama-3.1/transformers/llama-3-1-8b; do
            echo "===== $r ====="
            kaggle models instances files "$r" 2>&1 | head -4 || true
          done
      - name: Any public llama-3.1-8b weights as a dataset
        shell: bash
        run: |
          kaggle datasets list -s "llama 3.1 8b weights" --csv 2>&1 | head -6 || true
          kaggle datasets list -s "Llama-3.1-8B" --csv 2>&1 | head -8 || true

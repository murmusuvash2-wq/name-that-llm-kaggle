name: Read the kernel log
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  s:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --upgrade pip
          python -m pip install kaggle six python-slugify requests tqdm urllib3 certifi
      - name: Pull the log and the results
        shell: bash
        run: |
          rm -rf out && mkdir -p out
          kaggle kernels output janaiworkspace/llm-gmc -p out 2>&1 | tail -3 || true
          ls -la out | head
          echo "===== validation_results.json ====="
          cat out/validation_results.json 2>/dev/null | head -40 || echo "(none)"
          echo "===== log highlights ====="
          grep -aiE "OOF BA|LL8V5|ll8v5|admitted|MEASURED|IN-SAMPLE|sinkhorn|done in|reference" out/*.log 2>/dev/null | tail -30 || echo "(no log)"

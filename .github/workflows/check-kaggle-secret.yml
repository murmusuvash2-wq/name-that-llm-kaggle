name: Check Kaggle secret

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-secret:
    runs-on: ubuntu-latest
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
    steps:
      - name: Check token is available without revealing it
        run: |
          if [ -n "$KAGGLE_API_TOKEN" ]; then
            echo "KAGGLE_API_TOKEN is available to GitHub Actions."
          else
            echo "KAGGLE_API_TOKEN is missing or empty."
            exit 1
          fi

name: Read the trained checkpoint meta
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  s:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --upgrade pip
          python -m pip install kaggle six python-slugify requests tqdm urllib3 certifi
      - name: Fetch the checkpoint meta and the full log
        shell: bash
        run: |
          mkdir -p reports out
          {
            echo "===== dataset files ====="
            kaggle datasets files janaiworkspace/ntl-deb-ours --csv 2>&1 | head -12
            echo
            echo "===== meta.json ====="
            rm -rf ds && mkdir ds
            kaggle datasets download janaiworkspace/ntl-deb-ours -f meta.json -p ds --unzip 2>&1 | tail -2
            cat ds/meta.json 2>/dev/null || echo "(no meta)"
          } > reports/deb_meta.txt
          cat reports/deb_meta.txt
      - name: Commit
        shell: bash
        run: |
          git config user.name "report-bot"
          git config user.email "report-bot@users.noreply.github.com"
          git add reports/deb_meta.txt
          git commit -m "report: deb checkpoint meta" || echo nothing
          git push

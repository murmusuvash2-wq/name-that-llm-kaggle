name: Check the adapter datasets
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  c:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip kaggle
      - name: Search
        shell: bash
        run: |
          for q in "nlm-l24" "l24-adapters" "matched-clean" "llama-3.1-8b" "qwen3-14b-base"; do
            echo "########## $q"
            kaggle datasets list -s "$q" --csv 2>&1 | head -8 || true
          done
      - name: Files in the candidates
        shell: bash
        run: |
          for d in dhruvtibarewal/nlm-l24-adapters-v5 dhruvtibarewal/nlm-matched-clean dhruvtibarewal/nlm-l24-adapters; do
            echo "########## $d"
            kaggle datasets files "$d" 2>&1 | head -22 || true
          done

name: Verify dataset
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  s:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --upgrade pip
          python -m pip install kaggle six python-slugify requests tqdm urllib3 certifi
      - name: List
        shell: bash
        run: |
          mkdir -p reports
          kaggle datasets files janaiworkspace/ntl-deb-ours --csv > reports/ds_files.txt 2>&1 || true
          kaggle datasets list --user janaiworkspace --search ntl-deb > reports/ds_list.txt 2>&1 || true
          cat reports/ds_files.txt
      - name: Commit
        if: always()
        shell: bash
        run: |
          git config user.name "report-bot"
          git config user.email "report-bot@users.noreply.github.com"
          git add reports/ || true
          git commit -m "report: dataset files" || echo nothing
          git push || echo "push failed"

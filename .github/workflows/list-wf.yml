name: List workflows
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  s:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: List
        shell: bash
        run: |
          mkdir -p reports
          { ls -la .github/workflows/
            echo "--- names ---"
            for f in .github/workflows/*.yml; do
              echo "== $f"
              grep -E "^name:|workflow_dispatch|^on:" "$f" | head -4
            done
          } > reports/workflows.txt
          cat reports/workflows.txt
      - name: Commit
        if: always()
        shell: bash
        run: |
          git config user.name "report-bot"
          git config user.email "report-bot@users.noreply.github.com"
          git add reports/ || true
          git commit -m "report: workflow list" || echo nothing
          git push || echo "push failed"

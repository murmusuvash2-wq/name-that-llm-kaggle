name: Dump the probe log
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  s:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --upgrade pip
          python -m pip install kaggle six python-slugify requests tqdm urllib3 certifi
      - name: Dump
        shell: bash
        run: |
          mkdir -p out reports
          kaggle kernels output janaiworkspace/ntl-probe-deb-ours -p out 2>&1 | tail -2 || true
          python3 benchmarks/dump_kernel_log.py "out/*.log" > reports/deb_probe_body.txt 2>&1 || true
          tail -40 reports/deb_probe_body.txt
      - name: Commit
        shell: bash
        run: |
          git config user.name "report-bot"
          git config user.email "report-bot@users.noreply.github.com"
          git add reports/deb_probe_body.txt
          git commit -m "report: probe log body" || echo nothing
          git push

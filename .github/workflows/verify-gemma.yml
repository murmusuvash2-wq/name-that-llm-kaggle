name: Verify the gemma member
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  s:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --upgrade pip
          python -m pip install kaggle six python-slugify requests tqdm urllib3 certifi
      - name: Check and write the report
        shell: bash
        run: |
          mkdir -p reports
          {
            echo "===== alexchilton/ntl-ts-gemma2-9b files ====="
            kaggle datasets files alexchilton/ntl-ts-gemma2-9b --csv 2>&1 | head -16 || echo "NOT FOUND"
            echo
            echo "===== gemma on kaggle models ====="
            kaggle models list -s "gemma-2" --csv 2>&1 | head -8
            kaggle models list -s "gemma" --csv 2>&1 | head -8
            echo
            echo "===== other ntl-ts datasets ====="
            kaggle datasets list -s "ntl-ts" --csv 2>&1 | head -10
          } > reports/gemma_check.txt
          cat reports/gemma_check.txt
      - name: Commit
        shell: bash
        run: |
          git config user.name "report-bot"
          git config user.email "report-bot@users.noreply.github.com"
          git add reports/gemma_check.txt
          git commit -m "report: gemma member check" || echo nothing
          git push

name: My kernels and submissions
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  s:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --upgrade pip
          python -m pip install kaggle six python-slugify requests tqdm urllib3 certifi
      - name: My kernels
        shell: bash
        run: |
          kaggle kernels list --user janaiworkspace --page-size 30 --csv 2>&1 | head -35
      - name: Submissions
        shell: bash
        run: |
          kaggle competitions submissions -c name-that-llm --csv 2>&1 | head -10
      - name: Quota
        shell: bash
        run: kaggle quota 2>&1 | tail -5

name: Phase 2 DeBERTa candidate
on:
  workflow_dispatch:
jobs:
  phase2:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KAGGLE_USERNAME: janaiworkspace
      KERNEL_REF: janaiworkspace/deberta-phase2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip kaggle six
      - name: Prepare notebook metadata
        run: |
          mkdir -p kaggle_phase2
          cp notebooks/deberta-phase2.ipynb kaggle_phase2/deberta-phase2.ipynb
          python - <<'PY'
          import json, os
          m={"title":"Phase 2 DeBERTa candidate","id":f"{os.environ['KAGGLE_USERNAME']}/deberta-phase2","code_file":"deberta-phase2.ipynb","language":"python","kernel_type":"notebook","is_private":True,"enable_gpu":True,"enable_internet":False,"dataset_sources":["nishantdahal/ntl-two-stage-lora"],"competition_sources":["name-that-llm"],"kernel_sources":[],"model_sources":["illuminatep/deberta-v3-plain/transformers/base/1"]}
          json.dump(m,open('kaggle_phase2/kernel-metadata.json','w'),indent=2)
          PY
      - run: kaggle kernels push -p kaggle_phase2
      - name: Wait and collect
        run: |
          mkdir -p phase2-output
          completed=false
          for i in $(seq 1 180); do
            s="$(timeout 90s kaggle kernels status "$KERNEL_REF" 2>&1 || echo STATUS_TIMEOUT_OR_ERROR)"
            echo "Status $i/180: $s"
            if echo "$s" | grep -qiE "COMPLETE|SUCCESS"; then completed=true; break; fi
            if echo "$s" | grep -qiE "ERROR|CANCEL|FAILED|STATUS_TIMEOUT_OR_ERROR"; then
              echo "Kaggle status polling failed or kernel failed; stopping safely."
              exit 1
            fi
            sleep 60
          done
          [ "$completed" = true ]
          kaggle kernels output "$KERNEL_REF" -p phase2-output
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase2-deberta-results
          path: phase2-output/
          if-no-files-found: warn

name: Collect generated passages
on:
  workflow_dispatch:
    inputs:
      task:
        required: true
        default: "ntl-passage-generation"
permissions:
  contents: read
jobs:
  c:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      TASK: ${{ inputs.task }}
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip kaggle six
      - name: Status
        shell: bash
        run: kaggle benchmarks tasks status "$TASK" 2>&1 | head -40 || true
      - name: Download and count
        shell: bash
        run: |
          mkdir -p out
          kaggle benchmarks tasks download "$TASK" -o out -f 2>&1 | tail -25 || true
          echo "===== jsonl files ====="
          find out -name "*.jsonl" | head -20
          python3 - <<'PY'
          import glob, json
          from collections import Counter, defaultdict
          rows = []
          for p in glob.glob("out/**/*.jsonl", recursive=True):
              parts = p.split("/")
              model = parts[-3] if len(parts) > 3 else "?"
              run = parts[-2] if len(parts) > 2 else "?"
              for line in open(p, encoding="utf-8", errors="replace"):
                  try:
                      d = json.loads(line)
                      rows.append((model, run, d.get("text", "")))
                  except Exception:
                      pass
          print("passages:", len(rows))
          print("per model:", dict(Counter(m for m, _, _ in rows)))
          print("===== per run =====")
          by_run = defaultdict(list)
          for m, r, t in rows:
              by_run[(r, m)].append(len(t.split()))
          for (r, m) in sorted(by_run, key=lambda k: (k[1], k[0])):
              w = sorted(by_run[(r, m)])
              print(f"run {r} model {m}: n={len(w)} words min={w[0]} median={w[len(w)//2]} max={w[-1]}"
                    f" in40-250={sum(1 for x in w if 40 <= x <= 250)}")
          wc = sorted(len(t.split()) for _, _, t in rows)
          if wc:
              print("all words: min", wc[0], "median", wc[len(wc)//2], "max", wc[-1],
                    "| in 40-250:", sum(1 for w in wc if 40 <= w <= 250), "/", len(wc))
          PY
      - name: Quota
        if: always()
        shell: bash
        run: kaggle benchmarks quota || true

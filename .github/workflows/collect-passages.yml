name: Collect generated passages
on:
  workflow_dispatch:
    inputs:
      task:
        required: true
        default: "ntl-passage-generation"
permissions:
  contents: read
jobs:
  c:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      TASK: ${{ inputs.task }}
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip kaggle
      - name: Status
        shell: bash
        run: kaggle benchmarks tasks status "$TASK" 2>&1 | head -40 || true
      - name: Download and count
        shell: bash
        run: |
          mkdir -p out
          kaggle benchmarks tasks download "$TASK" -o out -f 2>&1 | tail -25 || true
          echo "===== jsonl files ====="
          find out -name "*.jsonl" | head -20
          python3 - <<'PY'
          import glob, json
          rows = []
          for p in glob.glob("out/**/*.jsonl", recursive=True):
              model = p.split("/")[-3] if len(p.split("/")) > 3 else "?"
              for line in open(p, encoding="utf-8", errors="replace"):
                  try:
                      d = json.loads(line)
                      rows.append((model, d.get("prompt_id"), d.get("text", "")))
                  except Exception:
                      pass
          print("passages:", len(rows))
          from collections import Counter
          c = Counter(m for m, _, _ in rows)
          print("per model:", dict(c))
          wc = [len(t.split()) for _, _, t in rows]
          if wc:
              wc.sort()
              print("words: min", wc[0], "median", wc[len(wc)//2], "max", wc[-1],
                    "| in 40-250:", sum(1 for w in wc if 40 <= w <= 250), "/", len(wc))
          md = sum(1 for _, _, t in rows if any(k in t for k in ("**", "##", "- ", "* ")))
          print("with markdown markers:", md)
          if rows:
              print("\n--- sample ---")
              print(rows[0][2][:300])
          PY
      - name: Quota
        if: always()
        shell: bash
        run: kaggle benchmarks quota || true

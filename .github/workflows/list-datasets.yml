name: List candidate member datasets
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  l:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip kaggle six
      - name: Search
        shell: bash
        run: |
          for q in ultrabert lora24 atlas stylegram tokattn; do
            echo "########## search: $q"
            kaggle datasets list -s "$q" --csv 2>&1 | head -12 || true
          done
      - name: Files in the hub we already attach
        shell: bash
        run: |
          echo "########## hub top level"
          kaggle datasets files lightningv08/ntl-olmo2-native24-final-inference-assets 2>&1 | head -40 || true
      - name: Files in the candidates
        shell: bash
        run: |
          for d in pjmathematician/ultrabert-380m-ntl josephadamski91/ntl-atlas-qwen3-8b-v1; do
            echo "########## $d"
            kaggle datasets files "$d" 2>&1 | head -25 || true
          done
      - name: Inspect ATLAS bundle
        shell: bash
        run: |
          mkdir -p atlas_bundle
          kaggle datasets download -d josephadamski91/ntl-atlas-qwen3-8b-v1 -p atlas_bundle --unzip
          find atlas_bundle -maxdepth 5 -type f -printf '%p %s bytes\n' | sort
          echo "===== atlas_bundle.json ====="
          cat atlas_bundle/atlas_adapter/atlas_adapter/atlas_bundle.json
          echo "===== inference.py ====="
          cat atlas_bundle/atlas_adapter/atlas_adapter/ntl_atlas/inference.py
          echo "===== model.py header ====="
          sed -n '1,240p' atlas_bundle/atlas_adapter/atlas_adapter/ntl_atlas/model.py
      - name: Upload ATLAS bundle inspection
        uses: actions/upload-artifact@v4
        with:
          name: atlas-bundle-inspection
          path: atlas_bundle/

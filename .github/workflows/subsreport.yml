name: Submissions report into the repo
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  s:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --upgrade pip
          python -m pip install kaggle six python-slugify requests tqdm urllib3 certifi
      - name: Write the tables
        shell: bash
        run: |
          mkdir -p reports
          {
            echo "# submissions"
            kaggle competitions submissions -c name-that-llm --csv 2>&1 | head -12
            echo
            echo "# leaderboard top 12"
            kaggle competitions leaderboard -c name-that-llm --show 2>&1 | head -16
            echo
            echo "# quota"
            kaggle quota 2>&1 | tail -5
          } > reports/submissions.md
          cat reports/submissions.md
      - name: Commit
        shell: bash
        run: |
          git config user.name  "report-bot"
          git config user.email "report-bot@users.noreply.github.com"
          git add reports/submissions.md
          git commit -m "report: submissions and leaderboard" || echo "nothing to commit"
          git push

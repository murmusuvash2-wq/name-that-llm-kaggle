name: Run the pool probe
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  p:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KAGGLE_USERNAME: janaiworkspace
      KERNEL_REF: janaiworkspace/ntl-pool-probe
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip kaggle
      - name: Prepare
        shell: bash
        run: |
          mkdir -p kaggle_kernel
          cp notebooks/pool-probe.ipynb kaggle_kernel/pool-probe.ipynb
          python - <<'PY'
          import json, os
          m = {"title": "NTL pool probe", "id": f"{os.environ['KAGGLE_USERNAME']}/ntl-pool-probe",
               "code_file": "pool-probe.ipynb", "language": "python", "kernel_type": "notebook",
               "is_private": True, "enable_gpu": False, "enable_tpu": False, "enable_internet": False,
               "dataset_sources": ["nishantdahal/ntl-handwriting-blend",
                                   "illiadolenko/ntl-merged-corpus-v1"],
               "competition_sources": ["name-that-llm"], "kernel_sources": [], "model_sources": []}
          json.dump(m, open("kaggle_kernel/kernel-metadata.json", "w"), indent=2)
          PY
      - name: Push and wait
        shell: bash
        run: |
          kaggle kernels push -p kaggle_kernel 2>&1 | tail -5
          for i in $(seq 1 60); do
            out="$(kaggle kernels status "$KERNEL_REF" 2>&1 || true)"
            echo "check $i: $out"
            echo "$out" | grep -qi "COMPLETE\|ERROR\|CANCEL" && break
            sleep 30
          done
      - name: Output
        if: always()
        shell: bash
        run: |
          mkdir -p out
          kaggle kernels output "$KERNEL_REF" -p out || true
          cat out/pool_probe.json 2>/dev/null || true
          tail -n 80 out/*.log 2>/dev/null || true

name: Train our own Qwen3-8B LoRA
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  t:
    runs-on: ubuntu-latest
    timeout-minutes: 290
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KAGGLE_USERNAME: janaiworkspace
      REF: janaiworkspace/ntl-train-q8-ours
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install CLI (six is imported but undeclared)
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install kaggle six python-slugify requests tqdm urllib3 certifi
      - name: Push the 8B training kernel
        shell: bash
        run: |
          mkdir -p kk && cp notebooks/ntl-train-q8-ours.ipynb kk/ntl-train-q8-ours.ipynb
          python - <<'PY'
          import json, os
          m = {"title": "NTL train q8 ours",
               "id": f"{os.environ['KAGGLE_USERNAME']}/ntl-train-q8-ours",
               "code_file": "ntl-train-q8-ours.ipynb", "language": "python", "kernel_type": "notebook",
               "is_private": True, "enable_gpu": True, "enable_internet": False,
               "dataset_sources": ["illiadolenko/ntl-merged-corpus-v2",
                                   "trnhip/ntl-api-gen",
                                   "harshitkmr/ntl-google-gen-v1"],
               "competition_sources": ["name-that-llm"], "kernel_sources": [],
               "model_sources": ["qwen-lm/qwen-3/transformers/8b-base/1"]}
          json.dump(m, open("kk/kernel-metadata.json", "w"), indent=2)
          PY
          kaggle kernels push -p kk 2>&1 | tail -3
          for i in $(seq 1 250); do
            out="$(kaggle kernels status "$REF" 2>&1 || true)"
            st="$(echo "$out" | grep -oE 'KernelWorkerStatus\.[A-Z]+' | head -1)"
            echo "check $i: $st"
            case "$st" in *COMPLETE*|*ERROR*|*CANCEL*) break ;; esac
            sleep 45
          done
      - name: Read the measurement and publish the adapter
        shell: bash
        run: |
          rm -rf out && mkdir -p out
          kaggle kernels output "$REF" -p out 2>&1 | tail -3 || true
          echo "===== output ====="
          ls -la out | head -14
          echo "===== meta.json ====="
          cat out/q8_ours/meta.json 2>/dev/null || echo "(no meta.json)"
          if [ -d out/q8_ours ]; then
            python - <<'PY'
          import json, os
          json.dump({"title": "NTL q8 ours", "id": f"{os.environ['KAGGLE_USERNAME']}/ntl-q8-ours"},
                    open("out/q8_ours/dataset-metadata.json", "w"), indent=2)
          PY
            kaggle datasets create -p out/q8_ours 2>&1 | tail -3 || kaggle datasets version -p out/q8_ours -m "retrain" 2>&1 | tail -3
          fi

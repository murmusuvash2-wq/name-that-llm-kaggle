name: Print our meta
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  s:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --upgrade pip
          python -m pip install kaggle six python-slugify requests tqdm urllib3 certifi
      - name: Fetch and show
        shell: bash
        run: |
          mkdir -p reports ds
          kaggle datasets download janaiworkspace/ntl-deb-ours -f meta.json -p ds --unzip 2>&1 | tail -2
          cp ds/meta.json reports/our_meta.json 2>/dev/null || echo "(download failed)" > reports/our_meta.json
          python3 -c "
          import json
          d = json.load(open('reports/our_meta.json'))
          print('keys:', list(d))
          print('labels count:', len(d.get('labels', [])))
          print('head:', str(d.get('head'))[:90])
          print('pooling:', str(d.get('pooling'))[:90])
          print('holdout_ba:', d.get('holdout_ba'))
          " 2>&1 | tee reports/meta_summary.txt
      - name: Commit
        if: always()
        shell: bash
        run: |
          git config user.name "report-bot"
          git config user.email "report-bot@users.noreply.github.com"
          git add reports/ || true
          git commit -m "report: our meta" || echo nothing
          git push || echo "push failed"

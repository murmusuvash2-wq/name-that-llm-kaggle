name: Train our own DeBERTa
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  t:
    runs-on: ubuntu-latest
    timeout-minutes: 280
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KAGGLE_USERNAME: janaiworkspace
      REF: janaiworkspace/ntl-train-deb-ours
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install CLI (six is imported but undeclared)
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install kaggle six python-slugify requests tqdm urllib3 certifi
      - name: Is there a checkpoint from a previous session
        shell: bash
        run: |
          if kaggle datasets files "$KAGGLE_USERNAME/ntl-deb-ours" --csv >/dev/null 2>&1; then
            echo "HAS_RESUME=yes" >> "$GITHUB_ENV"; echo "resuming from the published checkpoint"
          else
            echo "HAS_RESUME=no" >> "$GITHUB_ENV"; echo "first session, no checkpoint yet"
          fi
      - name: Push the training kernel
        shell: bash
        run: |
          mkdir -p kk && cp notebooks/ntl-train-deb-ours.ipynb kk/ntl-train-deb-ours.ipynb
          python - <<'PY'
          import json, os
          m = {"title": "NTL train deb ours",
               "id": f"{os.environ['KAGGLE_USERNAME']}/ntl-train-deb-ours",
               "code_file": "ntl-train-deb-ours.ipynb", "language": "python", "kernel_type": "notebook",
               "is_private": True, "enable_gpu": True, "enable_internet": False,
               "dataset_sources": ([f"{os.environ['KAGGLE_USERNAME']}/ntl-deb-ours"] if os.environ.get("HAS_RESUME")=="yes" else []) + ["nishantdahal/ntl-handwriting-blend",
                                   "illiadolenko/ntl-merged-corpus-v2",
                                   "trnhip/ntl-api-gen",
                                   "harshitkmr/ntl-google-gen-v1",
                                   "dhruvtibarewal/nlm-matched-clean"],
               "competition_sources": ["name-that-llm"], "kernel_sources": [],
               "model_sources": []}
          json.dump(m, open("kk/kernel-metadata.json", "w"), indent=2)
          PY
          kaggle kernels push -p kk 2>&1 | tail -3
          for i in $(seq 1 200); do
            out="$(kaggle kernels status "$REF" 2>&1 || true)"
            st="$(echo "$out" | grep -oE 'KernelWorkerStatus\.[A-Z]+' | head -1)"
            echo "check $i: $st"
            case "$st" in *COMPLETE*|*ERROR*|*CANCEL*) break ;; esac
            sleep 45
          done
      - name: Read the measurement and publish the checkpoint
        shell: bash
        run: |
          rm -rf out && mkdir -p out
          kaggle kernels output "$REF" -p out 2>&1 | tail -3 || true
          echo "===== what came out ====="
          ls -la out | head -12
          echo "===== meta.json ====="
          cat out/deberta_ours/meta.json 2>/dev/null || echo "(no meta.json)"
          if [ -d out/deberta_ours ]; then
            python - <<'PY'
          import json, os
          json.dump({"title": "NTL deb ours", "id": f"{os.environ['KAGGLE_USERNAME']}/ntl-deb-ours"},
                    open("out/deberta_ours/dataset-metadata.json", "w"), indent=2)
          PY
            kaggle datasets create -p out/deberta_ours 2>&1 | tail -3 || kaggle datasets version -p out/deberta_ours -m "retrain" 2>&1 | tail -3
          fi

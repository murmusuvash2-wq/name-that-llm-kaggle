name: Pull my private notebook
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  s:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --upgrade pip
          python -m pip install kaggle six python-slugify requests tqdm urllib3 certifi
      - name: Pull
        shell: bash
        run: |
          mkdir -p p && cd p
          kaggle kernels pull janaiworkspace/qwen-svc-atlas-oof-diagnostic -m 2>&1 | tail -3
          ls -la
          echo "===== metadata ====="
          cat kernel-metadata.json 2>/dev/null | head -40
          cd ..
          python benchmarks/show_nb.py p/*.ipynb

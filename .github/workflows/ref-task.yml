name: Read the reference benchmark task source
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ref:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip kaggle
      - name: Status of the reference task
        shell: bash
        run: |
          kaggle benchmarks tasks status what-is-kaggle 2>&1 | head -30 || true
          echo "-----"
          kaggle benchmarks tasks list 2>&1 | head -20 || true
      - name: Download with sources
        shell: bash
        run: |
          mkdir -p ref
          kaggle benchmarks tasks download what-is-kaggle -o ref -s -f 2>&1 | tail -15 || true
          echo "===== tree ====="
          find ref -maxdepth 4 -type f | head -40
      - name: Print every source file
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, pathlib
          for p in sorted(pathlib.Path("ref").rglob("*")):
              if not p.is_file():
                  continue
              if p.suffix not in (".ipynb", ".py", ".json", ".md"):
                  continue
              print("=" * 70)
              print("FILE:", p)
              try:
                  if p.suffix == ".ipynb":
                      nb = json.loads(p.read_text(encoding="utf-8", errors="replace"))
                      for i, c in enumerate(nb.get("cells", [])):
                          src = "".join(c.get("source", []))
                          if src.strip():
                              print(f"--- cell {i} ({c.get('cell_type')}) ---")
                              print(src[:2500])
                  else:
                      print(p.read_text(encoding="utf-8", errors="replace")[:3000])
              except Exception as e:
                  print("  could not read:", e)
          PY

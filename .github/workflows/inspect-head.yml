name: Inspect the v5 adapter head
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  i:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip kaggle torch --index-url https://download.pytorch.org/whl/cpu 2>/dev/null || python -m pip install --upgrade pip kaggle torch
      - name: Download the two small files
        shell: bash
        run: |
          mkdir -p out
          kaggle datasets download dhruvtibarewal/nlm-l24-adapters-v5 -f q14v5/heads.pt -p out --unzip 2>&1 | tail -2 || true
          kaggle datasets download dhruvtibarewal/nlm-l24-adapters-v5 -f q14v5/adapter_config.json -p out --unzip 2>&1 | tail -2 || true
          find out -type f | head
      - name: Print the adapter config
        shell: bash
        run: |
          f=$(find out -name "adapter_config.json" | head -1)
          echo "== $f"; cat "$f"
      - name: Print the head structure
        shell: bash
        run: |
          python3 - <<'PY'
          import glob, torch
          for p in glob.glob("out/**/heads.pt", recursive=True):
              print("==", p)
              obj = torch.load(p, map_location="cpu", weights_only=False)
              print("type:", type(obj))
              if isinstance(obj, dict):
                  for k, v in obj.items():
                      try:
                          print(f"  {k}: {tuple(v.shape)} {v.dtype}")
                      except AttributeError:
                          print(f"  {k}: {type(v)} = {str(v)[:120]}")
              else:
                  print(str(obj)[:400])
          PY

name: Submit an existing LLM GMC kernel version

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Kaggle kernel version number to submit (e.g. 58)"
        required: true
        default: "58"
      wait_seconds:
        description: "Seconds to wait for scoring (0 = up to 12h)"
        required: true
        default: "10800"

permissions:
  contents: read

jobs:
  submit:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KERNEL_REF: janaiworkspace/llm-gmc
      COMP: name-that-llm

    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Kaggle CLI
        run: python -m pip install --upgrade pip kaggle

      - name: Submit the kernel version and wait for scoring
        shell: bash
        run: |
          set -o pipefail
          kaggle competitions submit \
            -c "$COMP" \
            -k "$KERNEL_REF" \
            -v "${{ inputs.version }}" \
            -f submission.parquet \
            -m "v41: pool-trained specialists + OOF-selected post-processing (kernel v${{ inputs.version }})" \
            --wait "${{ inputs.wait_seconds }}" \
            --poll-interval 60

      - name: Show the submissions table
        if: always()
        shell: bash
        run: |
          kaggle competitions submissions -c "$COMP" | head -6

name: Check l24 v5 adapters and the Llama base
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  c:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip kaggle
      - name: All adapter folders
        shell: bash
        run: |
          echo "########## nlm-l24-adapters-v5"
          kaggle datasets files dhruvtibarewal/nlm-l24-adapters-v5 --csv 2>&1 | cut -d, -f1 | sed 's#/[^/]*$##' | sort -u | head -30
          echo
          echo "########## full file list (first 60)"
          kaggle datasets files dhruvtibarewal/nlm-l24-adapters-v5 --csv 2>&1 | head -60
      - name: matched-clean
        shell: bash
        run: |
          echo "########## nlm-matched-clean"
          kaggle datasets files dhruvtibarewal/nlm-matched-clean --csv 2>&1 | head -20
      - name: Llama base
        shell: bash
        run: |
          echo "########## kaggle models: llama"
          kaggle models list -s llama-3.1-8b --csv 2>&1 | head -12 || true
          echo "########## datasets: llama 3.1 8b"
          kaggle datasets list -s "llama-3.1-8b" --csv 2>&1 | head -10 || true
          echo "########## hub contents mentioning llama"
          kaggle datasets files lightningv08/ntl-olmo2-native24-final-inference-assets --csv 2>&1 | grep -i llama | head -20 || true

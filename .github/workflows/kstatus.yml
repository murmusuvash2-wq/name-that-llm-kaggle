name: Kernel status
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  s:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --upgrade pip
          python -m pip install kaggle six python-slugify requests tqdm urllib3 certifi
      - name: Status of everything
        shell: bash
        run: |
          mkdir -p reports
          {
            for k in janaiworkspace/ntl-pool-test janaiworkspace/llm-gmc janaiworkspace/ntl-probe-deb-ours janaiworkspace/ntl-tpu-probe; do
              echo "===== $k ====="
              kaggle kernels status "$k" 2>&1 | tail -1
            done
            echo "===== quota ====="
            kaggle quota 2>&1 | tail -5
            echo "===== submissions ====="
            kaggle competitions submissions -c name-that-llm --csv 2>&1 | head -4
          } > reports/status.txt
          cat reports/status.txt
      - name: Commit
        shell: bash
        run: |
          git config user.name "report-bot"
          git config user.email "report-bot@users.noreply.github.com"
          git add reports/status.txt
          git commit -m "report: status" || echo nothing
          git push

name: Inspect the Kaggle account

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      USER: janaiworkspace
      COMP: name-that-llm

    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Kaggle CLI
        run: python -m pip install --upgrade pip kaggle

      - name: Submissions
        shell: bash
        run: |
          echo "===== all submissions, newest first ====="
          kaggle competitions submissions -c "$COMP" || true

      - name: Kernels
        shell: bash
        run: |
          echo "===== own kernels, most recent first ====="
          kaggle kernels list --user "$USER" --page-size 100 --sort-by dateRun || true
          echo
          echo "===== own kernels, by score ====="
          kaggle kernels list --user "$USER" --page-size 100 --sort-by scoreDescending || true

      - name: Datasets and models
        shell: bash
        run: |
          echo "===== own datasets ====="
          kaggle datasets list --user "$USER" --page-size 100 || true
          echo
          echo "===== own models ====="
          kaggle models list --owner "$USER" --page-size 50 || true

      - name: Quota
        shell: bash
        run: |
          echo "===== gpu quota ====="
          kaggle quota || true
